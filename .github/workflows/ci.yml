name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  # master: HER commit'e BENZERSIZ grup (sha) -> hic kuyruga girmez, hic iptal olmaz;
  #         her merge tam dogrulanir. PR/branch: ref-bazli grup + cancel-in-progress
  #         (yeni push stale run'i iptal eder, CI dakikasi tasarrufu).
  # NOT (#174 eksikti): master'da cancel-in-progress:false TEK BASINA yetmez --
  #   ayni grupta bekleyen (pending) run'lardan GitHub yalnizca EN YENISINI tutar,
  #   oncekini "higher priority waiting request" ile iptal eder. Cozum: master'a
  #   sha-benzersiz grup vererek pending kuyrugunu tamamen ortadan kaldirmak.
  group: ${{ github.ref == 'refs/heads/master' && format('ci-master-{0}', github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

  type-check:
    name: 🔒 Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run type-check

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Run database/__tests__ (LLM judge unit tests)
        run: npm run test:db

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      SENTRY_AUTH_TOKEN: ""
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

  e2e:
    name: 🎭 E2E (chromium)
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      SENTRY_AUTH_TOKEN: ""
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      # NOT: CI'da SUPABASE_SERVICE_KEY (service-role) secret'i yok → service-role
      # kullanan sayfalar (landing/arena vb.) dev server'da hata verir ve render
      # flaky olur. Bu yuzden smoke yalniz service-role/data GEREKTIRMEYEN
      # auth-boundary spec'leriyle sinirli: oda + admin guard redirect'leri
      # (ilk CI kosusunda deterministik gecti). Tam suite icin operatorun
      # SUPABASE_SERVICE_KEY secret'i eklemesi gerekir (follow-up).
      - name: Run E2E smoke (chromium, backend-independent)
        run: npm run test:e2e -- --project=chromium e2e/oda-routes.spec.ts e2e/proxy-admin-guard.spec.ts

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
