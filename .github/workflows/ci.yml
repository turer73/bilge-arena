name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  # master: HER commit'e BENZERSIZ grup (sha) -> hic kuyruga girmez, hic iptal olmaz;
  #         her merge tam dogrulanir. PR/branch: ref-bazli grup + cancel-in-progress
  #         (yeni push stale run'i iptal eder, CI dakikasi tasarrufu).
  # NOT (#174 eksikti): master'da cancel-in-progress:false TEK BASINA yetmez --
  #   ayni grupta bekleyen (pending) run'lardan GitHub yalnizca EN YENISINI tutar,
  #   oncekini "higher priority waiting request" ile iptal eder. Cozum: master'a
  #   sha-benzersiz grup vererek pending kuyrugunu tamamen ortadan kaldirmak.
  group: ${{ github.ref == 'refs/heads/master' && format('ci-master-{0}', github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lockfile-guard:
    # package-lock.json Windows/macOS'ta uretilirse npm, Linux-only optional
    # deps'i budar (npm/cli#4828: rollup/next-swc/lightningcss/sharp/rolldown
    # -linux-x64-gnu + @emnapi/core). Sonuc: CI'da kriptik "npm ci ... Missing".
    # Bu kapi pruning'i ERKEN ve NET mesajla yakalar; lockfile Linux'te (Klipper)
    # uretilmeli. Konvansiyon degil, enforce.
    name: 🔐 Lockfile platform guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify Linux-native optional deps present in package-lock.json
        run: |
          missing=()
          for pkg in \
            "@rollup/rollup-linux-x64-gnu" \
            "@next/swc-linux-x64-gnu" \
            "lightningcss-linux-x64-gnu" \
            "@unrs/resolver-binding-linux-x64-gnu" \
            "@img/sharp-linux-x64" \
            "@emnapi/core"; do
            grep -q "\"node_modules/${pkg}\"" package-lock.json || missing+=("$pkg")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::package-lock.json eksik Linux-native optional dep: ${missing[*]}"
            echo ""
            echo "SEBEP: lockfile buyuk olasilikla Windows/macOS'ta uretildi; npm,"
            echo "       Linux-only optional deps'i buddu (npm/cli#4828)."
            echo "COZUM: Linux'te (Klipper) yeniden uret ve commit et:"
            echo "       rm -rf node_modules package-lock.json && npm install"
            exit 1
          fi
          echo "OK: lockfile Linux-native optional deps iceriyor (6/6 sentinel)."

  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Check migration idempotency and SECURITY DEFINER grants
        run: npm run lint:migrations && npm run lint:migration-grants

  type-check:
    name: 🔒 Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run type-check

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Run database contract tests
        run: npm run test:db -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/test-db.json"

      # test:db veritabanisiz kosar; PostgreSQL dosyalari burada "skipped" gorunur.
      # Atlanan her dosya scripts/security/postgres-ci-suites.mjs'teki bir PG
      # takiminda kosmali (2026-10'a kadar 13 dosya / 67 test hicbir iste kosmuyordu).
      - name: Require every skipped database test to run in a PostgreSQL job
        run: node scripts/security/verify-db-skip-coverage.mjs "$RUNNER_TEMP/test-db.json"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ./coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  institution-pilot-postgres:
    name: 🏫 Institution pilot PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bilge_inst_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bilge_inst_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      INSTITUTION_PILOT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bilge_inst_test_ci
      INSTITUTION_PILOT_TEST_DATABASE_DISPOSABLE: '1'
      TEACHER_CLASSROOM_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bilge_r42_test_ci
      TEACHER_CLASSROOM_TEST_DATABASE_DISPOSABLE: '1'
      LEADERBOARD_PRIVACY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bilge_inst_test_ci
      LEADERBOARD_PRIVACY_TEST_DATABASE_DISPOSABLE: '1'
      RETENTION_ERASURE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bilge_r02_test_ci
      RETENTION_ERASURE_TEST_DATABASE_DISPOSABLE: '1'
      PUSH_SUBSCRIPTIONS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bilge_push_test_ci
      PUSH_SUBSCRIPTIONS_TEST_DATABASE_DISPOSABLE: '1'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Create isolated acceptance databases
        run: >-
          node -e "const { Client } = require('pg');
          (async () => { const client = new Client({ connectionString:
          'postgres://postgres:postgres@localhost:5432/postgres' });
          await client.connect(); await client.query('CREATE DATABASE bilge_r42_test_ci');
          await client.query('CREATE DATABASE bilge_r02_test_ci');
          await client.query('CREATE DATABASE bilge_push_test_ci');
          await client.end(); })().catch((error) => { console.error(error); process.exit(1); });"

      # run-postgres-ci-suite.mjs dosya listesini postgres-ci-suites.mjs'ten alir
      # ve atlanan, eksik ya da bos dosyayi iceren raporu reddeder.
      - name: Run tenant-boundary acceptance tests
        run: node scripts/security/run-postgres-ci-suite.mjs institution-pilot

      - name: Run teacher classroom privacy acceptance tests
        run: node scripts/security/run-postgres-ci-suite.mjs teacher-classroom

      - name: Run public leaderboard privacy acceptance tests
        run: node scripts/security/run-postgres-ci-suite.mjs leaderboard-privacy

      - name: Run tombstone and retention boundary acceptance tests
        run: node scripts/security/run-postgres-ci-suite.mjs retention-erasure

      - name: Run push subscription privilege acceptance tests
        run: node scripts/security/run-postgres-ci-suite.mjs push-subscriptions

  question-quality-postgres:
    name: 🧭 Question quality PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bilge_r43_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bilge_r43_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CONTENT_GOVERNANCE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bilge_r43_test_ci
      CONTENT_GOVERNANCE_TEST_DATABASE_DISPOSABLE: '1'
      SOCIAL_PILOT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bilge_social_pilot_test_ci
      SOCIAL_PILOT_TEST_DATABASE_DISPOSABLE: '1'
      VERIFIED_ATTEMPTS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bilge_r02_test_ci
      VERIFIED_ATTEMPTS_TEST_DATABASE_DISPOSABLE: '1'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Create isolated diagnostic database
        run: >-
          node -e "const { Client } = require('pg');
          (async () => { const client = new Client({ connectionString:
          'postgres://postgres:postgres@localhost:5432/postgres' });
          await client.connect(); await client.query('CREATE DATABASE bilge_r02_test_ci');
          await client.query('CREATE DATABASE bilge_social_pilot_test_ci');
          await client.end(); })().catch((error) => { console.error(error); process.exit(1); });"

      - name: Run revision-bound diagnostic and governance acceptance tests
        run: node scripts/security/run-postgres-ci-suite.mjs question-quality

      - name: Run curriculum scope release acceptance test
        run: node scripts/security/run-postgres-ci-suite.mjs curriculum-scope

      - name: Run distinct-day mastery evidence acceptance test
        run: node scripts/security/run-postgres-ci-suite.mjs mastery-evidence

      - name: Run isolated four-domain Social discovery acceptance tests
        run: node scripts/security/run-postgres-ci-suite.mjs social-pilot

      - name: Install local PostgreSQL binaries for canonical reader acceptance
        run: sudo apt-get update && sudo apt-get install -y postgresql-16

      - name: Run source-review v2 and AI-owner native acceptance without optional skip
        env:
          SOURCE_REVIEW_PG_BIN: /usr/lib/postgresql/16/bin
          SOURCE_REVIEW_PG_REQUIRED: '1'
        run: node scripts/security/run-postgres-ci-suite.mjs source-review-native

      - name: Run controlled measurement and calibration readiness acceptance
        env:
          SOURCE_REVIEW_PG_BIN: /usr/lib/postgresql/16/bin
          SOURCE_REVIEW_PG_REQUIRED: '1'
        run: node scripts/security/run-postgres-ci-suite.mjs controlled-measurement

      - name: Run canonical identity and deduplicated evidence acceptance
        env:
          CANONICAL_PG_BIN: /usr/lib/postgresql/16/bin
        # The test starts its own loopback cluster; no production/test-service URL.
        run: node scripts/security/run-postgres-ci-suite.mjs canonical-identity

      - name: Run formal TYT Social scope acceptance
        env:
          CANONICAL_PG_BIN: /usr/lib/postgresql/16/bin
        run: node scripts/security/run-postgres-ci-suite.mjs formal-tyt-social-scope

      - name: Run TYT reviewed pool preflight acceptance
        env:
          CANONICAL_PG_BIN: /usr/lib/postgresql/16/bin
        run: node scripts/security/run-postgres-ci-suite.mjs tyt-reviewed-pool

  tyt-social-epoch-postgres:
    # The forward epoch migration is opt-in in test:db. This separate job must execute it;
    # the required Build job depends on it, including the no-skip report gate.
    name: TYT Social epoch PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TYT_SOCIAL_EPOCH_TEST_DATABASE_DISPOSABLE: '1'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Create isolated TYT Social epoch database
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { randomBytes } from 'node:crypto'
          import { appendFileSync } from 'node:fs'
          import pg from 'pg'
          if (process.versions.node.split('.')[0] !== '22' || !process.env.GITHUB_ENV) {
            throw new Error('Node 22 and GitHub environment file required')
          }
          const database = `bilge_r44_test_${randomBytes(8).toString('hex')}`
          if (!/^bilge_r44_test_[a-f0-9]{16}$/.test(database)) {
            throw new Error('Disposable database name rejected')
          }
          // This job-local service is the only permitted bootstrap target.
          const baseUrl = 'postgresql://postgres:postgres@127.0.0.1:5432/'
          const client = new pg.Client({ connectionString: `${baseUrl}postgres`, connectionTimeoutMillis: 5000 })
          try {
            await client.connect()
            const { rows } = await client.query("SELECT current_setting('server_version_num')::int AS version")
            if (rows[0].version < 160000 || rows[0].version >= 170000) {
              throw new Error('PostgreSQL 16 required')
            }
            await client.query(`CREATE DATABASE ${database}`)
            appendFileSync(process.env.GITHUB_ENV, `TYT_SOCIAL_EPOCH_TEST_DATABASE_URL=${baseUrl}${database}\n`)
          } finally {
            await client.end()
          }
          NODE

      - name: Run TYT Social epoch acceptance with no skipped tests
        # postgres-ci-suites.mjs bu takim icin tam 18 testi sabitler.
        run: node scripts/security/run-postgres-ci-suite.mjs tyt-social-epoch

  learning-reward-postgres:
    # Odul, satin alma, coin olcegi, FSRS, koc akisi, lig ve notlama davranisini
    # gercek PostgreSQL 16'da kosar. Bu 13 dosya (67 test) 2026-10'a kadar test:db'de
    # "skipped" gorunup hicbir CI isinde kosmuyordu. Dosyalar public semasini
    # sifirladigi icin takim sirayla kosar; testler veritabani adini kendi
    # kaliplariyla (bilge_rNN_test_*) dogrular.
    name: 🎯 Learning and reward PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bilge_r02_test_ci
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d bilge_r02_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VERIFIED_ATTEMPTS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/bilge_r02_test_ci
      VERIFIED_ATTEMPTS_TEST_DATABASE_DISPOSABLE: '1'
      WLL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/bilge_r31_test_ci
      WLL_TEST_DATABASE_DISPOSABLE: '1'
      SPOTLIGHTS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/bilge_r32_test_ci
      SPOTLIGHTS_TEST_DATABASE_DISPOSABLE: '1'
      TEAM_BOSS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/bilge_r33_test_ci
      TEAM_BOSS_TEST_DATABASE_DISPOSABLE: '1'
      PAPER_PACK_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/bilge_r41_test_ci
      PAPER_PACK_TEST_DATABASE_DISPOSABLE: '1'
      CANONICAL_CATEGORY_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/bilge_r109_test_ci
      CANONICAL_CATEGORY_TEST_DATABASE_DISPOSABLE: '1'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Create isolated learning and reward databases
        run: >-
          node -e "const { Client } = require('pg');
          (async () => { const client = new Client({ connectionString:
          'postgres://postgres:postgres@127.0.0.1:5432/postgres' });
          await client.connect();
          for (const name of ['bilge_r31_test_ci', 'bilge_r32_test_ci', 'bilge_r33_test_ci', 'bilge_r41_test_ci', 'bilge_r109_test_ci'])
          await client.query('CREATE DATABASE ' + name);
          await client.end(); })().catch((error) => { console.error(error); process.exit(1); });"

      - name: Run learning, reward and grading acceptance with no skipped tests
        run: node scripts/security/run-postgres-ci-suite.mjs learning-reward

  postgrest-contract:
    # Route testleri servis-role istemcisini mock'lar ve .returns<T>() tip
    # denetimini susturur; PostgREST gömme ve FK sözleşmesini göremezler
    # (/api/comments 17 Mayıs'tan beri PGRST200 verdi). Bu iş src/ altındaki
    # her *.postgrest.test.ts dosyasını gerçek PostgreSQL 16 + PostgREST'e karşı
    # koşar; dosyalar public şemasını sıfırladığı için sırayla çalışır.
    name: 🔗 PostgREST contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bilge_postgrest_contract_ci
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d bilge_postgrest_contract_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGREST_CONTRACT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/bilge_postgrest_contract_ci
      POSTGREST_CONTRACT_TEST_DATABASE_DISPOSABLE: '1'
      POSTGREST_CONTRACT_TEST_URL: http://127.0.0.1:3300
      # Yalnız bu işin geçici PostgREST'i için; üretim anahtarı değildir.
      POSTGREST_CONTRACT_TEST_JWT_SECRET: bilge-arena-postgrest-contract-ci-only-jwt-secret
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Create Supabase Data API roles
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg'
          const client = new pg.Client({ connectionString: process.env.POSTGREST_CONTRACT_TEST_DATABASE_URL })
          await client.connect()
          await client.query(`
            CREATE ROLE authenticator LOGIN PASSWORD 'authenticator' NOINHERIT;
            CREATE ROLE anon NOLOGIN;
            CREATE ROLE authenticated NOLOGIN;
            CREATE ROLE service_role NOLOGIN BYPASSRLS;
            GRANT anon, authenticated, service_role TO authenticator;
          `)
          await client.end()
          NODE

      - name: Start PostgREST
        shell: bash
        run: |
          docker run -d --name postgrest --network host \
            -e PGRST_DB_URI=postgres://authenticator:authenticator@127.0.0.1:5432/bilge_postgrest_contract_ci \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$POSTGREST_CONTRACT_TEST_JWT_SECRET" \
            -e PGRST_SERVER_PORT=3300 \
            -e PGRST_ADMIN_SERVER_PORT=3301 \
            postgrest/postgrest:v14.17
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:3301/ready >/dev/null && exit 0
            sleep 1
          done
          docker logs postgrest
          exit 1

      - name: Run every PostgREST contract file with no skipped tests
        shell: bash
        run: |
          node node_modules/vitest/vitest.mjs run --no-file-parallelism postgrest.test.ts \
            --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/postgrest-contract.json"
          node scripts/security/verify-postgrest-contract-ci-result.mjs "$RUNNER_TEMP/postgrest-contract.json"

      - name: PostgREST logs
        if: ${{ failure() }}
        run: docker logs postgrest

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, institution-pilot-postgres, question-quality-postgres, tyt-social-epoch-postgres, learning-reward-postgres, postgrest-contract]
    # Explicitly fail Build when a required dependency did not execute.
    if: ${{ !cancelled() }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      SENTRY_AUTH_TOKEN: ""
    steps:
      - name: Require successful CI dependencies
        shell: bash
        env:
          DEPENDENCY_RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          if [ "$DEPENDENCY_RESULTS" != "success,success,success,success,success,success,success,success" ]; then
            echo "::error::Required CI dependency failed or did not execute"
            exit 1
          fi

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

  e2e:
    name: 🎭 E2E (chromium)
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      SENTRY_AUTH_TOKEN: ""
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      # NOT: CI'da SUPABASE_SERVICE_KEY (service-role) secret'i yok → service-role
      # kullanan sayfalar (landing/arena vb.) dev server'da hata verir ve render
      # flaky olur. Bu yuzden smoke yalniz service-role/data GEREKTIRMEYEN
      # auth-boundary ve fixture kullanan spec'lerle sinirli: oda, admin, mobil quiz
      # (ilk CI kosusunda deterministik gecti). Tam suite icin operatorun
      # SUPABASE_SERVICE_KEY secret'i eklemesi gerekir (follow-up).
      - name: Run E2E smoke (chromium, backend-independent)
        run: npm run test:e2e -- --project=chromium e2e/oda-routes.spec.ts e2e/proxy-admin-guard.spec.ts e2e/tyt-social-preparation.spec.ts e2e/controlled-measurement.spec.ts e2e/mobile-ux-first-pass.spec.ts e2e/mobile-ux-accessibility.spec.ts

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  e2e-production:
    name: 🎭 E2E production hydration
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    # Dev sunucusu hydration uyumsuzluğunu üretimdeki gibi raporlamaz; bu kapı
    # minified üretim paketinde ana sayfa konsolunu ölçer (React #418).
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      SENTRY_AUTH_TOKEN: ""
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run production hydration gate
        run: npm run test:e2e:prod

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-production-report
          path: playwright-report/
          retention-days: 7
