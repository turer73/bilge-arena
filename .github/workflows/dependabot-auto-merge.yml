name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  # checks + statuses ZORUNLU: "gh pr checks" hem check-run'lari (GitHub Actions
  # job'lari) hem commit status'lerini (Vercel) okur. Bu ikisi olmadan komut HATA
  # VERMEZ, sessizce BOS liste doner -- dongu sonsuza kadar "No checks reported"
  # basip timeout'a kadar bekler. #297'de 30 dakika boyunca tam bunu yasadi.
  checks: read
  statuses: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      # NOT: "gh pr review --approve" adimi bilerek YOK.
      # GITHUB_TOKEN ile PR onaylamak GitHub tarafinda yasak:
      #   "GitHub Actions is not permitted to approve pull requests"
      # Eski surumde ilk adim buydu ve HER dependabot PR'inda job'i oldurdu
      # (#296-305'in hepsindeki auto-merge hatasinin kok nedeni). master'da
      # zorunlu-review kurali da yok, yani o onay zaten gereksizdi.
      - name: Wait for CI then merge
        run: |
          echo "Waiting for CI checks to complete..."
          while true; do
            # Kendi job'umuzu (auto-merge) DISLA. Aksi halde kendi IN_PROGRESS
            # durumumuzu gorup kendimizi bekler, timeout'a kadar donup fail ederiz.
            # "|| true" ZORUNLU: GitHub Actions run bloklari "bash -e" ile kosar
            # ve "gh pr checks" basarisiz check varsa exit 8 doner. Onsuz script
            # daha donguye girmeden oluyor -- "CI failed" satiri bile basilmiyor.
            CHECKS=$(gh pr checks "$PR_URL" --json name,state \
              -q '[.[] | select(.name != "auto-merge") | .state] | join(" ")' || true)
            echo "checks: $CHECKS"

            # Bos cikti = check listesi henuz olusmadi; merge etme, bekle.
            if [ -z "$CHECKS" ]; then
              echo "No checks reported yet, waiting 30s..."
              sleep 30
              continue
            fi

            if echo "$CHECKS" | grep -qE "IN_PROGRESS|QUEUED|PENDING|EXPECTED"; then
              echo "CI still running, waiting 30s..."
              sleep 30
            elif echo "$CHECKS" | grep -qE "FAILURE|ERROR|CANCELLED|TIMED_OUT|ACTION_REQUIRED"; then
              echo "CI failed, not merging"
              exit 1
            else
              echo "All CI passed, merging..."
              break
            fi
          done
          # --auto KULLANILMIYOR: repoda allow_auto_merge kapali, o bayrakla komut
          # hata verir. CI'yi yukarida zaten bekledigimiz icin dogrudan merge.
          gh pr merge --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 30
