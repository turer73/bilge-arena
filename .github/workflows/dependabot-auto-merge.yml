name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Read verified Dependabot update type
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
      # NOT: "gh pr review --approve" adimi bilerek YOK -- GITHUB_TOKEN ile PR
      # onaylamak GitHub tarafinda yasak ("GitHub Actions is not permitted to
      # approve pull requests"). master'da zorunlu-review kurali da yok.
      - name: Wait for CI then merge
        run: |
          # Bilinmeyen veya major guncellemeler insan incelemesinde kalir.
          # Yalniz dogrulanmis patch/minor metadata'si otomatik birlesebilir.
          if [ "$UPDATE_TYPE" != "version-update:semver-patch" ] && [ "$UPDATE_TYPE" != "version-update:semver-minor" ]; then
            echo "Otomatik birlestirme yok: update-type=$UPDATE_TYPE"
            exit 0
          fi

          echo "::group::Teshis - baglam"
          echo "repo:      $REPO"
          echo "head sha:  $HEAD_SHA"
          echo "pr:        $PR_URL"
          echo "actor:     $PR_ACTOR"
          echo "::endgroup::"

          # "gh pr checks" KULLANILMIYOR: dependabot baglaminda sessizce BOS liste
          # donuyordu (hata basmadan), dongu 30 dk "No checks reported" deyip
          # timeout'a dusuyordu. Ayni komut lokal PAT ile sorunsuz calisiyor.
          # Bunun yerine iki kaynak DOGRUDAN sorgulaniyor:
          #   - check-runs   -> GitHub Actions job'lari (Lint/Test/Build/E2E...)
          #   - commit status-> Vercel, Codecov gibi harici entegrasyonlar
          collect_states() {
            # check-runs: tamamlanmamislar icin .status, tamamlananlar icin .conclusion
            gh api "repos/$REPO/commits/$HEAD_SHA/check-runs" --paginate \
              -q '.check_runs[] | select(.name != "auto-merge") | (.conclusion // .status)' 2>/dev/null || true
            # commit statuses: pending/success/failure/error
            gh api "repos/$REPO/commits/$HEAD_SHA/status" \
              -q '.statuses[].state' 2>/dev/null || true
          }

          CI_CLEAN=false
          for attempt in $(seq 1 60); do
            STATES=$(collect_states | tr '\n' ' ')
            COUNT=$(echo "$STATES" | wc -w)
            echo "[$attempt] durum sayisi=$COUNT | $STATES"

            # Hic durum yoksa check'ler henuz kaydedilmemis demektir -- merge ETME.
            if [ "$COUNT" -eq 0 ]; then
              echo "Henuz check yok, 30s bekleniyor..."
              sleep 30
              continue
            fi

            if echo "$STATES" | grep -qiE "\b(queued|in_progress|pending|waiting|requested)\b"; then
              echo "CI devam ediyor, 30s bekleniyor..."
              sleep 30
              continue
            fi

            if echo "$STATES" | grep -qiE "\b(failure|cancelled|timed_out|action_required|error|stale)\b"; then
              echo "CI basarisiz -> merge EDILMIYOR"
              exit 1
            fi

            echo "Tum CI gecti."
            CI_CLEAN=true
            break
          done

          if [ "$CI_CLEAN" != "true" ]; then
            echo "CI 30 dakika icinde temiz olarak tamamlanmadi -> merge EDILMIYOR"
            exit 1
          fi

          if [ "$PR_ACTOR" != "dependabot[bot]" ]; then
            echo "Bu bir dogrulama kosusu (actor=$PR_ACTOR); merge adimi ATLANIYOR."
            exit 0
          fi

          # --auto KULLANILMIYOR: repoda allow_auto_merge kapali, o bayrakla komut
          # hata verir. CI zaten yukarida beklendi.
          gh pr merge --squash --delete-branch "$PR_URL"
        env:
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_ACTOR: ${{ github.event.pull_request.user.login }}
          UPDATE_TYPE: ${{ steps.dependabot-metadata.outputs.update-type }}
          # secrets.GITHUB_TOKEN yerine github.token: dependabot baglaminda
          # secrets ayri bir kasadan gelir ve davranis farkli olabiliyor.
          GITHUB_TOKEN: ${{ github.token }}
        timeout-minutes: 30
