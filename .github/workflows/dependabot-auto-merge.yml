name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize]
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Approve PR
        run: gh pr review "$PR_URL" --approve -b "dependabot auto-approve"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for CI then auto-merge
        run: |
          echo "Waiting for CI checks to complete..."
          while true; do
            CHECKS=$(gh pr checks "$PR_URL" --json state -q '[.[].state]')
            if echo "$CHECKS" | grep -q "IN_PROGRESS\|QUEUED\|PENDING"; then
              echo "CI still running, waiting 30s..."
              sleep 30
            elif echo "$CHECKS" | grep -q "FAILURE\|ERROR\|CANCELLED"; then
              echo "CI failed, not merging"
              exit 1
            else
              echo "All CI passed, merging..."
              break
            fi
          done
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 15
