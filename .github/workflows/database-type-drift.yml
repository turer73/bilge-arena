name: Database type drift

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-type-drift
  cancel-in-progress: true

jobs:
  compare-production-schema:
    name: Compare production schema
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_ID: lvnmzdowhfzmpkueurih
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate types from production schema
        env:
          # Keep the credential out of checkout, setup and dependency lifecycle
          # processes. The small Node wrapper passes it only to the pinned CLI;
          # invoking Node directly also prevents npm pre/post hook exposure.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_TOKEN_EXPIRES_AT: ${{ vars.SUPABASE_TOKEN_EXPIRES_AT }}
        run: node scripts/sync-database-types.mjs

      - name: Compare generated types with checked-in schema
        id: compare
        run: |
          if ! git diff --quiet -- src/types/database.generated.ts; then
            echo "Database type drift detected. Download the production-database-types artifact and commit the reviewed result."
            git diff --stat -- src/types/database.generated.ts
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "Database types match the production public schema."
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload generated production types on drift
        if: steps.compare.outputs.drift == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: production-database-types-${{ github.sha }}
          path: src/types/database.generated.ts
          if-no-files-found: error
          retention-days: 7

      - name: Fail when production types drift
        if: steps.compare.outputs.drift == 'true'
        run: exit 1
