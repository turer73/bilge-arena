name: Database type drift

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-type-drift
  cancel-in-progress: true

jobs:
  compare-production-schema:
    name: Compare production schema
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: lvnmzdowhfzmpkueurih
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate types from production schema
        run: npm run db:types

      - name: Compare generated types with checked-in schema
        run: |
          if ! git diff --quiet -- src/types/database.generated.ts; then
            echo "Database type drift detected. Download the production-database-types artifact and commit the reviewed result."
            exit 1
          fi
          echo "Database types match the production public schema."

      - name: Upload generated production types on drift
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-database-types-${{ github.sha }}
          path: src/types/database.generated.ts
          if-no-files-found: error
          retention-days: 7
