server {
  listen 8080;
  server_tokens off;
  resolver 127.0.0.11 valid=10s;
  client_max_body_size 5m;
  # Auth tokens and magic links must not enter request logs.
  access_log off;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  add_header X-Bilge-Environment "isolated-synthetic-test" always;
  location = /__test/health { return 200 "isolated academy test gateway\n"; }
  location = /__test/login {
    set $test_entry http://app:3138;
    proxy_pass $test_entry;
    proxy_set_header Host $http_host;
  }
  location ^~ /auth/v1/admin { return 403; }
  location /auth/v1/ {
    set $auth_backend http://auth:9999;
    rewrite ^/auth/v1/(.*)$ /$1 break;
    proxy_pass $auth_backend;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /rest/v1/ {
    set $rest_backend http://auth-rest:3000;
    rewrite ^/rest/v1/(.*)$ /$1 break;
    proxy_pass $rest_backend;
    proxy_set_header Host $http_host;
  }
  location / {
    # Test data must not reach production analytics or the hard-coded room WS.
    # This CSP is scoped to this gateway; production app policy is unchanged.
    proxy_hide_header Content-Security-Policy;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob:; connect-src 'self' ws://localhost:3137; frame-ancestors 'none'; form-action 'self'; base-uri 'self'" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Bilge-Environment "isolated-synthetic-test" always;
    set $app_backend http://app:3000;
    proxy_pass $app_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 180s;
  }
}
